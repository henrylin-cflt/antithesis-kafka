bootstrapServers: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
consumerIsolationLevel: "read_committed"
enableDebug: false
enableTransactions: true
strictMode: true
logDir: "./logs"

topicCount:
  min: 1
  max: 3
topicPartitionCount:
  min: 1
  max: 6
producerCount:
  min: 1
  max: 3
consumerGroupCount:
  min: 1
  max: 3
consumerGroupMembersCount:
  min: 1
  max: 7

producerStartupDelayMs:
  min: 0
  max: 1000
producerUniqueSequenceCount:
  min: 1
  max: 10
producerSequenceLength:
  min: 1
  max: 10
producerSequenceDelayMs:
  min: 0
  max: 50

consumerGroupMemberStartupDelayMs:
  min: 0
  max: 1000
consumerGroupMemberProcessDelayMs:
  min: 10
  max: 50

producerSendTimeoutMs:
  min: 500
  max: 5000

messageTimeoutMs:
  min: 2000
  max: 10000

transactionTimeoutMs:
  min: 1000
  max: 12000
    